<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f19"/>
      <stop offset="1" stop-color="#1a1020"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e01f3d"/>
      <stop offset="1" stop-color="#ff5a5f"/>
    </linearGradient>
  </defs>

  <rect width="900" height="260" rx="14" fill="url(#bg)"/>

  <!-- Shield with clock -->
  <g transform="translate(70,52)">
    <path d="M60 0 L116 20 V70 C116 110 92 138 60 152 C28 138 4 110 4 70 V20 Z" fill="none" stroke="#e01f3d" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="60" cy="76" r="30" fill="none" stroke="#f5f5f7" stroke-width="4"/>
    <line x1="60" y1="76" x2="60" y2="58" stroke="#f5f5f7" stroke-width="4" stroke-linecap="round"/>
    <line x1="60" y1="76" x2="74" y2="84" stroke="#ff5a5f" stroke-width="4" stroke-linecap="round"/>
    <circle cx="60" cy="76" r="3.5" fill="#f5f5f7"/>
  </g>

  <!-- Title -->
  <text x="230" y="92" fill="#f5f5f7" font-size="38" font-weight="700">Just-In-Time Privileged Access</text>
  <text x="232" y="126" fill="#a9adbb" font-size="18">Zero standing admin rights · MFA-gated · time-boxed · auto-revoked</text>

  <!-- Elevation timeline -->
  <g transform="translate(232,168)" font-size="13">
    <line x1="0" y1="14" x2="600" y2="14" stroke="#3a3f4f" stroke-width="4" stroke-linecap="round"/>
    <rect x="210" y="8" width="300" height="12" rx="6" fill="url(#bar)"/>

    <circle cx="0" cy="14" r="7" fill="#f5f5f7"/>
    <text x="0" y="46" fill="#a9adbb" text-anchor="start">Request + justify</text>

    <circle cx="210" cy="14" r="7" fill="#f5f5f7"/>
    <text x="210" y="46" fill="#a9adbb" text-anchor="middle">Entra MFA → elevated</text>

    <text x="360" y="0" fill="#ff5a5f" text-anchor="middle" font-weight="600">3–6 hour window</text>

    <circle cx="510" cy="14" r="7" fill="#f5f5f7"/>
    <text x="510" y="46" fill="#a9adbb" text-anchor="middle">Auto-revoked</text>

    <circle cx="600" cy="14" r="7" fill="#3a3f4f"/>
    <text x="600" y="46" fill="#6b7080" text-anchor="end">No standing access</text>
  </g>
</svg>
