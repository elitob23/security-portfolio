<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="password-generator: readable passwords for new user accounts">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111a2b"/>
      <stop offset="100%" stop-color="#0b1622"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#2f81f7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" rx="12" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#accent)"/>

  <!-- lock mark -->
  <g transform="translate(72, 116)" fill="none" stroke="#3fb950" stroke-width="5">
    <path d="M18 34 V22 a22 22 0 0 1 44 0 V34" stroke-linecap="round"/>
    <rect x="4" y="34" width="72" height="62" rx="10" fill="#3fb950" fill-opacity="0.12"/>
    <circle cx="40" cy="60" r="7" fill="#3fb950" stroke="none"/>
    <path d="M40 67 V79" stroke-linecap="round"/>
  </g>

  <!-- title block -->
  <text x="196" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="52" font-weight="700" fill="#e6edf3">password-generator</text>
  <text x="196" y="174" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#8b949e">Readable, random passwords for new user accounts</text>

  <!-- spec chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
    <rect x="196" y="200" width="168" height="34" rx="17" fill="#3fb950" fill-opacity="0.14" stroke="#3fb950" stroke-opacity="0.45"/>
    <text x="280" y="222" fill="#7ee787" text-anchor="middle">15–16 characters</text>

    <rect x="378" y="200" width="196" height="34" rx="17" fill="#2f81f7" fill-opacity="0.14" stroke="#2f81f7" stroke-opacity="0.45"/>
    <text x="476" y="222" fill="#79c0ff" text-anchor="middle">standard library only</text>

    <rect x="588" y="200" width="176" height="34" rx="17" fill="#a371f7" fill-opacity="0.14" stroke="#a371f7" stroke-opacity="0.45"/>
    <text x="676" y="222" fill="#d2a8ff" text-anchor="middle">copies to clipboard</text>
  </g>

  <!-- terminal sample -->
  <g transform="translate(800, 78)">
    <rect x="0" y="0" width="330" height="184" rx="10" fill="#010409" stroke="#30363d"/>
    <rect x="0" y="0" width="330" height="30" rx="10" fill="#161b22"/>
    <rect x="0" y="20" width="330" height="10" fill="#161b22"/>
    <circle cx="20" cy="15" r="5" fill="#ff7b72"/>
    <circle cx="38" cy="15" r="5" fill="#d29922"/>
    <circle cx="56" cy="15" r="5" fill="#3fb950"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
      <text x="18" y="60" fill="#8b949e">$ python passwordgenerator.py</text>
      <text x="18" y="88" fill="#e6edf3">Gunmen-Fixer96#</text>
      <text x="18" y="112" fill="#e6edf3">Rafters-Stony51?</text>
      <text x="18" y="136" fill="#e6edf3">Marlin-Hefted33%</text>
      <text x="18" y="164" fill="#7ee787">Copied to clipboard.</text>
    </g>
  </g>
</svg>
