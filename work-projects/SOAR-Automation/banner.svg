  <g transform="translate(60,54)"><path d="M60 34 V64 M60 64 L24 104 M60 64 L96 104" stroke="#f5f5f7" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="60" cy="24" r="16" fill="#0b0f19" stroke="#e01f3d" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><rect x="44" y="52" width="32" height="24" rx="6" fill="#0b0f19" stroke="#e01f3d" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="24" cy="116" r="14" fill="#0b0f19" stroke="#f5f5f7" stroke-width="4"/><circle cx="96" cy="116" r="14" fill="#ff5a5f"/><path d="M89 116 l5 5 l9 -10" stroke="#0b0f19" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>

  <text x="220" y="86" fill="#f5f5f7" font-size="34" font-weight="700">SOAR Automation</text>
  <text x="221" y="118" fill="#a9adbb" font-size="17">Falcon Fusion workflows that triage, notify and contain on their own</text>

  <g transform="translate(250,168)" font-size="13"><line x1="30" y1="14" x2="540" y2="14" stroke="#3a3f4f" stroke-width="4" stroke-linecap="round"/><rect x="30" y="8" width="510" height="12" rx="6" fill="url(#bar)"/><text x="285" y="-2" fill="#ff5a5f" text-anchor="middle" font-weight="600">Fully automated, no analyst in the loop</text><circle cx="30" cy="14" r="7" fill="#f5f5f7"/><text x="30" y="44" fill="#a9adbb" text-anchor="middle">OverWatch detection</text><circle cx="200" cy="14" r="7" fill="#f5f5f7"/><text x="200" y="44" fill="#a9adbb" text-anchor="middle">Set to in progress</text><circle cx="370" cy="14" r="7" fill="#f5f5f7"/><text x="370" y="44" fill="#a9adbb" text-anchor="middle">Email + watchlists</text><circle cx="540" cy="14" r="7" fill="#f5f5f7"/><text x="540" y="44" fill="#a9adbb" text-anchor="middle">Contain workstation</text></g>
