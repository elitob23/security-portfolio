      <stop offset="0" stop-color="#0b0f19"/>
      <stop offset="1" stop-color="#1a1020"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e01f3d"/>
      <stop offset="1" stop-color="#ff5a5f"/>
